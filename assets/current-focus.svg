<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320" viewBox="0 0 850 320" role="img" aria-label="Current focus animated progress bars">
<style>text{font-family:monospace;fill:#DAD6EB;font-size:15px}.pct{fill:#BBA7FF}.bg{fill:#151424}.fill{fill:#7967B5}</style>
<rect width="850" height="320" rx="14" fill="#0B0D19" stroke="#302743"/>
