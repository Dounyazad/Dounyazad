<style>
.row{opacity:0;animation:rin .8s ease-out forwards}
@keyframes rin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
.chip{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
.trace{stroke-dasharray:90 910;animation:trace 7s linear infinite}
@keyframes trace{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
.fade{opacity:0;animation:rin 1s ease-out forwards}
.cur{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dot{animation:pulse 2s ease-in-out infinite}
</style>
