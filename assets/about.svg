<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366" role="img" aria-label="About Dounyazad Berkane" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12101f"/><stop offset="1" stop-color="#0b0a16"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#7967B5" stop-opacity="0"/><stop offset=".5" stop-color="#BBA7FF"/><stop offset="1" stop-color="#7967B5" stop-opacity="0"/></linearGradient>
