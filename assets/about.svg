<svg xmlns="http://www.w3.org/2000/svg" width="720" height="365" viewBox="0 0 720 365"><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bca7ff"/><stop offset="1" stop-color="#5c89d8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d19"/><stop offset="1" stop-color="#070810"/></linearGradient></defs><rect x="1" y="1" width="718" height="363" rx="16" fill="url(#bg)" stroke="#353451"/><text x="31" y="43" font-family="monospace" font-size="17" font-weight="normal" letter-spacing="1" fill="#bca7ff">01   /   THE PERSON BEHIND THE CODE</text><path d="M30 61H690" stroke="#32334c" stroke-width="1"/><text x="32" y="102" font-family="monospace" font-size="19" font-weight="normal" letter-spacing="0" fill="#e1dfed">Final-year AI &amp; Data Science engineering student at ENSIA.</text><text x="32" y="133" font-family="monospace" font-size="19" font-weight="normal" letter-spacing="0" fill="#e1dfed">I like problems that demand more than a clever model:</text><text x="32" y="164" font-family="monospace" font-size="19" font-weight="normal" letter-spacing="0" fill="#e1dfed">clean data, thoughtful experiments, and systems that work</text><text x="32" y="195" font-family="monospace" font-size="19" font-weight="normal" letter-spacing="0" fill="#e1dfed">outside a notebook.</text><text x="32" y="257" font-family="monospace" font-size="17" font-weight="normal" letter-spacing="0" fill="#a9a1c7">A little analytical, a little creative. Always curious.</text><path d="M30 300H690" stroke="#32334c" stroke-width="1"/><text x="32" y="335" font-family="monospace" font-size="13" font-weight="normal" letter-spacing="1" fill="#c2b1ff">CURRENTLY  /  OPEN TO PAID AI &amp; DATA OPPORTUNITIES</text></svg>